services:
  - type: web
    name: dazzle-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_PUBLIC
        value: "true"
      - key: MCP_ENABLE_OAUTH
        value: "false"
      - key: DAZZLE_SHOW_ALL_TOOLS
        value: "true"
      - key: DAZZLE_EXPOSE_LEGACY_TOOLS
        value: "true"
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: MCP_API_KEY
        sync: false
