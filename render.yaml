services:
  - type: web
    name: dazzle-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: MCP_API_KEY
        sync: false
