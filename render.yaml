services:
  - type: web
    name: dazzle-mcp
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node packages/mcp/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_API_KEY
        sync: false
